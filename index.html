<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>台北政壇大富翁</title>
  <style>
    @font-face {
      font-family: 'Cubic11';
      src: url('assets/fonts/Cubic_11.woff2') format('woff2');
      font-display: block;
    }
    html, body { margin: 0; height: 100%; background: #1d2b53; overflow: hidden; touch-action: manipulation; }
    #game { width: 100%; height: 100%; }
    canvas { image-rendering: pixelated; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    // 版本號：每次更新遊戲就改這個（例如 2026.11.20-2），瀏覽器就會重新下載新的檔案，不會用到舊的暫存
    window.GAME_VERSION = '2026.11.20-3';
    [
      'lib/phaser.min.js',
      'src/pixelart.js',
      'src/data.js',
      'src/common.js',
      'src/music.js',
      'src/title.js',
      'src/game.js',
      'src/hud.js',
      'src/boot.js',
    ].forEach((f) => document.write('<script src="' + f + '?v=' + window.GAME_VERSION + '"><\/script>'));
  </script>
</body>
</html>
