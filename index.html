<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>台北政壇大富翁</title>
  <style>
    @font-face {
      font-family: 'Cubic11';
      src: url('assets/fonts/Cubic_11.woff2') format('woff2');
      font-display: block;
    }
    html, body { margin: 0; height: 100%; background: #1d2b53; overflow: hidden; touch-action: manipulation; }
    #game { width: 100%; height: 100%; }
    canvas { image-rendering: pixelated; }

    /* 選戰指南視窗（像素風） */
    #guide {
      position: fixed; inset: 0; z-index: 10; background: rgba(5, 8, 20, 0.75);
      display: flex; align-items: center; justify-content: center;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      font-family: 'Cubic11', monospace; color: #fff1e8;
    }
    #guide .g-box {
      width: min(640px, 100%); max-height: 100%; display: flex; flex-direction: column;
      background: #1d2b53; border: 4px solid #000; box-shadow: 6px 6px 0 #000, inset 0 0 0 3px #29adff;
    }
    #guide .g-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 14px; background: #ffec27; color: #000; border-bottom: 4px solid #000; font-size: 26px;
    }
    #guide .g-head button {
      font-family: inherit; font-size: 18px; padding: 6px 12px; background: #fff1e8; color: #000;
      border: 3px solid #000; box-shadow: 3px 3px 0 #000; cursor: pointer;
    }
    #guide .g-head button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
    #guide .g-body { overflow-y: auto; padding: 6px 16px 16px; font-size: 17px; line-height: 1.6; -webkit-overflow-scrolling: touch; }
    #guide h3 { color: #ffec27; font-size: 21px; margin: 16px 0 6px; font-weight: normal; }
    #guide h4 { color: #7fd3ff; font-size: 18px; margin: 0 0 2px; font-weight: normal; }
    #guide p { margin: 4px 0; }
    #guide ul, #guide ol { margin: 4px 0; padding-left: 1.3em; }
    #guide b { color: #ffec27; font-weight: normal; }
    #guide .g-tile { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 2px dashed #3a4a80; }
    #guide .g-pic { flex: 0 0 72px; height: 72px; display: flex; align-items: flex-end; justify-content: center; }
    #guide .g-pic img { max-width: 72px; max-height: 72px; image-rendering: auto; }

    /* 英文挑戰視窗 */
    #quiz {
      position: fixed; inset: 0; z-index: 11; background: rgba(5, 8, 20, 0.75);
      display: flex; align-items: center; justify-content: center;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      font-family: 'Cubic11', monospace; color: #fff1e8;
    }
    #quiz .q-box {
      width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: #1d2b53;
      border: 4px solid #000; box-shadow: 6px 6px 0 #000, inset 0 0 0 3px #00e436;
    }
    #quiz .q-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 14px; background: #00e436; color: #000; border-bottom: 4px solid #000; font-size: 24px;
    }
    #quiz .q-who { font-size: 16px; padding: 3px 8px; border: 2px solid #000; color: #000; }
    #quiz .q-body { padding: 14px 16px 18px; }
    #quiz .q-type { margin: 0 0 6px; color: #7fd3ff; font-size: 16px; }
    #quiz .q-q { margin: 0 0 10px; font-size: 24px; line-height: 1.5; overflow-wrap: anywhere; }
    #quiz .q-hint { margin: 0 0 12px; color: #ffec27; font-size: 18px; }
    #quiz button, #quiz input {
      font-family: inherit; font-size: 22px; color: #000; border: 3px solid #000; box-shadow: 3px 3px 0 #000;
    }
    #quiz button { background: #fff1e8; padding: 10px 12px; cursor: pointer; }
    #quiz button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
    #quiz button:disabled { cursor: default; }
    #quiz .q-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    #quiz .q-choices button { text-align: center; min-height: 56px; overflow-wrap: anywhere; }
    #quiz .q-choices button.ok { background: #00e436; }
    #quiz .q-choices button.bad { background: #ff77a8; }
    #quiz .q-fill { display: flex; gap: 10px; }
    #quiz .q-fill input { flex: 1; min-width: 0; padding: 10px; background: #fff1e8; }
    #quiz .q-fill button { background: #ffec27; }
    #quiz .q-result { margin-top: 14px; padding: 10px 12px; border: 3px solid #000; background: #0b1020; }
    #quiz .q-result.ok { box-shadow: inset 0 0 0 3px #00e436; }
    #quiz .q-result.bad { box-shadow: inset 0 0 0 3px #ff004d; }
    #quiz .q-result p { margin: 4px 0; font-size: 19px; }
    #quiz .q-result b { color: #ffec27; font-weight: normal; }
    #quiz .q-verdict { font-size: 26px !important; }
    #quiz .q-result.ok .q-verdict { color: #00e436; }
    #quiz .q-result.bad .q-verdict { color: #ff77a8; }
    #quiz .q-note { color: #c2c3c7; }
    #quiz .q-next { margin-top: 8px; width: 100%; background: #ffec27 !important; }
    @media (max-width: 420px) { #quiz .q-choices { grid-template-columns: 1fr; } }

    /* 戰將系統視窗（招募、派任務、拔樁戰） */
    .gv-modal {
      position: fixed; inset: 0; z-index: 11; background: rgba(5, 8, 20, 0.75);
      display: flex; align-items: center; justify-content: center;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      font-family: 'Cubic11', monospace; color: #fff1e8;
    }
    .gv-box { width: min(680px, 100%); max-height: 100%; overflow-y: auto; background: #1d2b53; border: 4px solid #000; box-shadow: 6px 6px 0 #000, inset 0 0 0 3px var(--gv); }
    .gv-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; background: var(--gv); color: #000; border-bottom: 4px solid #000; font-size: 24px; }
    .gv-who { font-size: 16px; padding: 3px 8px; border: 2px solid #000; }
    .gv-body { padding: 12px 14px 16px; }
    .gv-body h4 { margin: 14px 0 8px; font-size: 20px; font-weight: normal; color: #ffec27; }
    .gv-tip { margin: 0 0 10px; font-size: 18px; line-height: 1.5; color: #c2c3c7; }
    .gv-tip b { color: #ffec27; font-weight: normal; }
    .gv-sub { margin: 4px 0; font-size: 16px; color: #c2c3c7; }
    .gv-low { color: #ff77a8; font-weight: normal; }
    .gv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 10px; }
    .gv-card { display: flex; gap: 10px; padding: 8px; background: #0b1020; border: 3px solid #000; box-shadow: inset 0 0 0 2px #3a4a80; }
    .gv-face { flex: 0 0 76px; height: 92px; background: #29366f no-repeat center 4% / 150% auto; border: 3px solid #000; }
    .gv-stake { display: flex; align-items: center; justify-content: center; font-size: 40px; color: #ffec27; background: #5f574f; }
    .gv-info { flex: 1; min-width: 0; }
    .gv-name { margin: 0 0 4px; font-size: 22px; }
    .gv-name small { display: block; font-size: 15px; color: #7fd3ff; }
    .gv-stat { display: flex; align-items: center; gap: 6px; font-size: 15px; line-height: 1.3; }
    .gv-stat span { flex: 0 0 2.4em; color: #c2c3c7; }
    .gv-stat i { font-style: normal; color: #ffa300; letter-spacing: 1px; }
    .gv-stat i em { font-style: normal; color: #3a4a80; }
    .gv-stat b { font-weight: normal; }
    .gv-modal button {
      font-family: inherit; font-size: 18px; color: #000; background: #fff1e8; border: 3px solid #000; box-shadow: 3px 3px 0 #000;
      padding: 8px 10px; margin-top: 6px; width: 100%; cursor: pointer; text-align: center;
    }
    .gv-modal button small { display: block; font-size: 14px; color: #333; margin-top: 2px; }
    .gv-modal button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
    .gv-modal button:disabled { opacity: 0.45; cursor: default; }
    .gv-modal button.gv-picked { opacity: 1; background: #ffec27; outline: 3px solid #ff004d; }
    .gv-modal .gv-skip { background: #c2c3c7; margin-top: 12px; }
    .gv-modal .gv-next { background: #ffec27; }
    .gv-actions { display: flex; flex-direction: column; gap: 2px; }
    .bt-vs { display: flex; align-items: center; gap: 8px; }
    .bt-side { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8px; background: #0b1020; border: 3px solid #000; }
    .bt-side .gv-face { flex: 0 0 auto; width: 84px; height: 100px; }
    .bt-stats { margin: 2px 0; font-size: 15px; color: #c2c3c7; }
    .bt-team { margin: 4px 0 0; width: 100%; height: 8px; border: 2px solid #000; }
    .bt-mid { font-size: 30px; color: #ff004d; text-shadow: 2px 2px 0 #000; }
    .bt-score { font-size: 26px; white-space: nowrap; }
    .bt-rule { margin-top: 10px; font-size: 15px; }
    .bt-log { display: flex; flex-direction: column; gap: 6px; }
    .bt-round { padding: 8px; background: #0b1020; border: 2px solid #3a4a80; font-size: 16px; line-height: 1.5; }
    .bt-round b { color: #ffec27; font-weight: normal; }
    .bt-dice { display: block; }
    .bt-dice em { font-style: normal; }
    .bt-dice .ok, .bt-result.ok p { color: #00e436; }
    .bt-dice .bad, .bt-result.bad p { color: #ff77a8; }
    .bt-pick { margin-top: 10px; }
    .bt-result p { margin: 6px 0; font-size: 22px; }
    .gv-skill { margin: 4px 0 2px; font-size: 14px; color: #ffec27; line-height: 1.35; }
    .lg-row { margin: 0 0 8px; padding: 6px 10px; background: #0b1020; font-size: 17px; line-height: 1.5; }
    .lg-row p { margin: 2px 0; }
    .lg-head { color: #7fd3ff; font-size: 15px; }
    .lg-ch { color: #ffec27; font-size: 15px; }
    .bt-stage { margin-top: 10px; }
    .bt-think { text-align: center; font-size: 20px; color: #fff1e8; }
    .bt-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .gv-modal .bt-card {
      display: flex; flex-direction: column; align-items: center; gap: 2px; margin: 0; padding: 6px 4px 8px;
      background: #fff1e8; color: #000; border: 3px solid #000; box-shadow: 3px 3px 0 #000; font-family: inherit; text-align: center;
    }
    .bt-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border: 2px solid #000; image-rendering: auto; }
    .bt-card b { font-size: 24px; font-weight: normal; margin-top: 2px; }
    .bt-card span { font-size: 17px; color: #7e2553; }
    .bt-card small { font-size: 13px; color: #333; line-height: 1.3; }
    .gv-modal .bt-speech { box-shadow: 3px 3px 0 #000, inset 0 0 0 3px #29adff; }
    .gv-modal .bt-visit { box-shadow: 3px 3px 0 #000, inset 0 0 0 3px #00e436; }
    .gv-modal .bt-rally { box-shadow: 3px 3px 0 #000, inset 0 0 0 3px #ffa300; }
    .gv-modal button.bt-card:hover:not(:disabled) { transform: translateY(-3px); }
    .bt-clash { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .bt-half { flex: 1; max-width: 220px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px; border: 3px solid transparent; }
    .bt-half .bt-card { width: 100%; max-width: 150px; }
    .bt-half.bt-win { border-color: #ffec27; background: rgba(255, 236, 39, 0.12); }
    .bt-die {
      width: 64px; height: 64px; display: flex; align-items: center; justify-content: center;
      background: #fff1e8; color: #000; border: 4px solid #000; box-shadow: 4px 4px 0 #000; font-size: 40px;
    }
    .bt-die.roll { transform: rotate(14deg) scale(1.08); }
    .bt-calc { font-size: 15px; color: #c2c3c7; text-align: center; }
    .bt-total { line-height: 1; }
    .bt-total b { font-size: 56px; font-weight: normal; color: #fff1e8; text-shadow: 3px 3px 0 #000; vertical-align: middle; }
    .bt-a .bt-total b { color: #7fd3ff; }
    .bt-d .bt-total b { color: #ff9fbf; }
    .bt-win .bt-total b { color: #ffec27; }
    .bt-verdict { text-align: center; font-size: 24px; margin: 8px 0 0; }
    .bt-verdict.ok { color: #00e436; }
    .bt-verdict.bad { color: #ff77a8; }
    .bt-log { margin-top: 10px; }
    .bt-round em { font-style: normal; }
    .bt-round .ok { color: #00e436; }
    .bt-round .bad { color: #ff77a8; }
    @media (max-width: 420px) { .bt-card b { font-size: 20px; } .bt-card small { font-size: 12px; } .bt-total b { font-size: 46px; } .bt-die { width: 54px; height: 54px; font-size: 34px; } }
    @media (max-width: 420px) { .gv-grid { grid-template-columns: 1fr; } .bt-side .gv-face { width: 64px; height: 78px; } .gv-name { font-size: 19px; } }

    /* 選戰趨勢變化報告（外框和選戰指南一樣） */
    #report {
      position: fixed; inset: 0; z-index: 10; background: rgba(5, 8, 20, 0.8);
      display: flex; align-items: center; justify-content: center;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      font-family: 'Cubic11', monospace; color: #fff1e8;
    }
    #report .g-box { width: min(760px, 100%); max-height: 100%; display: flex; flex-direction: column; background: #1d2b53; border: 4px solid #000; box-shadow: 6px 6px 0 #000, inset 0 0 0 3px #29adff; }
    #report .g-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; background: #29adff; color: #000; border-bottom: 4px solid #000; font-size: 24px; }
    #report .g-head button { font-family: inherit; font-size: 18px; padding: 6px 12px; background: #fff1e8; color: #000; border: 3px solid #000; box-shadow: 3px 3px 0 #000; cursor: pointer; }
    #report .g-body { overflow-y: auto; padding: 12px 16px 16px; font-size: 16px; -webkit-overflow-scrolling: touch; }
    #report h3 { color: #ffec27; font-size: 20px; margin: 16px 0 6px; font-weight: normal; }
    #report .r-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    #report .r-stats div { background: #0b1020; border: 3px solid #000; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    #report .r-stats span { color: #c2c3c7; font-size: 14px; }
    #report .r-stats b { font-weight: normal; font-size: 22px; color: #fff1e8; overflow-wrap: anywhere; }
    #report .r-stats small { color: #c2c3c7; font-size: 13px; }
    #report .r-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 6px; font-size: 15px; }
    #report .r-key { display: inline-flex; align-items: center; gap: 6px; }
    #report .r-key b { font-weight: normal; color: #ffec27; }
    #report .r-plot { position: relative; }
    #report .r-chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
    #report .r-grid { stroke: #3a4a80; stroke-width: 1; }
    #report .r-base, #report .r-tick { stroke: #83769c; stroke-width: 1; }
    #report .r-cross { stroke: #c2c3c7; stroke-width: 1; stroke-dasharray: 3 3; }
    #report .r-axis { fill: #c2c3c7; font-size: 13px; font-family: inherit; font-variant-numeric: tabular-nums; }
    #report .r-end { fill: #fff1e8; font-size: 14px; font-family: inherit; }
    #report .r-tip { position: absolute; top: 4px; min-width: 150px; background: #0b1020; border: 3px solid #000; box-shadow: 3px 3px 0 #000; padding: 6px 10px; pointer-events: none; font-size: 14px; }
    #report .r-tip p { margin: 2px 0; display: flex; align-items: center; gap: 6px; }
    #report .r-tip p:first-child { color: #ffec27; }
    #report .r-tip i { width: 10px; height: 10px; display: inline-block; border: 1px solid #000; }
    #report .r-tip b { margin-left: auto; font-weight: normal; font-variant-numeric: tabular-nums; }
    #report details { margin-top: 12px; }
    #report summary { cursor: pointer; color: #7fd3ff; font-size: 16px; }
    #report .r-table { overflow-x: auto; margin-top: 8px; }
    #report table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
    #report th, #report td { border-bottom: 1px solid #3a4a80; padding: 4px 8px; text-align: right; white-space: nowrap; }
    #report th:first-child, #report td:first-child { text-align: left; }
    #report th { color: #c2c3c7; font-weight: normal; }
    @media (max-width: 480px) { #report .r-stats div { padding: 6px; } #report .r-stats b { font-size: 17px; } #report .r-stats span, #report .r-stats small { font-size: 12px; } #report .g-body { padding: 10px; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    // 版本號：每次更新遊戲就改這個（例如 2026.11.20-2），瀏覽器就會重新下載新的檔案，不會用到舊的暫存
    window.GAME_VERSION = '2026.11.21-3';
    [
      'lib/phaser.min.js',
      'src/pixelart.js',
      'src/data.js',
      'src/common.js',
      'src/music.js',
      'src/guide.js',
      'src/quiz.js',
      'src/report.js', 'src/generals.js',
      'src/title.js',
      'src/game.js',
      'src/hud.js',
      'src/boot.js',
    ].forEach((f) => document.write('<script src="' + f + '?v=' + window.GAME_VERSION + '"><\/script>'));
  </script>
</body>
</html>
